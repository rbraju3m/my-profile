# Add to the site's Nginx config in Forge (Site → Files → Edit Nginx
# Configuration), inside the `server { listen 443 ... }` block, above the
# `location /` block.
#
# The site sits behind the Cloudflare proxy, so without this every visitor
# would appear to come from a Cloudflare IP: the contact form's per-address
# rate limit would then be shared by everyone. Nginx only trusts the header
# from Cloudflare's own ranges, so it cannot be spoofed.
#
# Ranges from https://www.cloudflare.com/ips/ (checked Nov 2026). Refresh
# them with deploy/cloudflare-ips.sh if Cloudflare ever changes them.

# --- Cloudflare real visitor IP ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- Long-lived caching for Vite's hashed assets ---
location /build/assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}

# --- Never serve dotfiles (.env, .git) even if one ends up in public/ ---
location ~ /\.(?!well-known) {
    deny all;
}

# Uploads limit: CV PDFs are up to 10 MB, project screenshots up to 8 MB each.
client_max_body_size 64m;
